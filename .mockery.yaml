# mockery v3, pinned in tools/mockery and run by `make generate` (CI runs it
# before build, test and lint). Mocks are in-package mock_<interface>_test.go
# files: they exist only in test binaries, never in a library build, and are
# never committed (.gitignore: mock_*). Every module whose packages get mocks
# keeps a mockery_test.go importing testify/mock, so its go.mod and go.sum are
# the same with or without them.
# Unexported interfaces included: their in-package mocks serve in-package tests.
all: true
dir: '{{.InterfaceDir}}'
filename: 'mock_{{.InterfaceName | snakecase}}_test.go'
structname: 'Mock{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
inpackage: true
template: testify
template-data:
  unroll-variadic: true
packages:
  github.com/hyperscale-stack/security:
    config:
      recursive: true
      # Library packages only: the examples and the private test modules need
      # no mocks, and the tool modules are not part of the workspace.
      exclude-subpkg-regex:
        - '^github\.com/hyperscale-stack/security/(examples|internal|tools)(/|$)'
    interfaces:
      # The basic module's tests double the core's AttemptLimiter: a second
      # mock of it is generated into basic (mocks are in-package test files,
      # so the core's own mock is not visible there).
      AttemptLimiter:
        configs:
          - {}
          - dir: basic
            pkgname: basic
            inpackage: false
