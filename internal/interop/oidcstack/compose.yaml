# Disposable databases for the opt-in real-backend tests of the OpenID
# Connect client's transaction stores (never used by routine CI). Images
# are pinned by digest — the ones internal/interop/saml uses — and every
# port is bound to 127.0.0.1 on a non-default port, distinct from that
# project's, so both can run at once. Nothing is persisted.
#
#   export OIDCCLIENT_DB_PASSWORD="$(openssl rand -hex 16)"
#   docker compose -f internal/interop/oidcstack/compose.yaml up -d --wait
#   cd internal/interop/oidcstack
#   OIDCCLIENT_POSTGRES_DSN="postgres://oidcclient:$OIDCCLIENT_DB_PASSWORD@127.0.0.1:25432/oidcclient?sslmode=disable" \
#   OIDCCLIENT_MYSQL_DSN="root:$OIDCCLIENT_DB_PASSWORD@tcp(127.0.0.1:23306)/oidcclient" \
#   OIDCCLIENT_REDIS_ADDR=127.0.0.1:26379 \
#   go test -race -count=1 -run 'TestRealBackend' ./...
#   docker compose -f internal/interop/oidcstack/compose.yaml down

name: oidcclient-interop

services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: oidcclient
      POSTGRES_PASSWORD: ${OIDCCLIENT_DB_PASSWORD:?set OIDCCLIENT_DB_PASSWORD}
      POSTGRES_DB: oidcclient
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oidcclient -d oidcclient"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: ${OIDCCLIENT_DB_PASSWORD:?set OIDCCLIENT_DB_PASSWORD}
      MYSQL_DATABASE: oidcclient
    ports:
      - "127.0.0.1:23306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7.4@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
