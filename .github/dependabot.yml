version: 2
updates:
  # go.work at the root: Dependabot's go.work mode updates every module the
  # workspace lists (all modules but tools/*; `make check-modules` fails when
  # a module is missing from go.work). One entry per directory would make it
  # open the same update once per module.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
    assignees:
      - euskadi31

  # The development tools, one module per tool outside go.work. Each tool is
  # an indirect requirement of its module (a `tool` directive), so it is
  # allowed by name; the tools' own dependencies follow the tool releases.
  - package-ecosystem: gomod
    directories:
      - "/tools/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "github.com/golangci/golangci-lint/v2"
        dependency-type: "all"
      - dependency-name: "golang.org/x/vuln"
        dependency-type: "all"
      - dependency-name: "github.com/mattn/goveralls"
        dependency-type: "all"
      - dependency-name: "github.com/vektra/mockery/v3"
        dependency-type: "all"
    assignees:
      - euskadi31

  # The workflows: every action is pinned to a commit SHA with its version in
  # a comment, which Dependabot reads to propose the next one.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - euskadi31
