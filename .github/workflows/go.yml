name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only token for every job: nothing in this workflow writes to the
# repository, its packages or its pull requests.
permissions:
  contents: read

# A pull request keeps only its latest run. Every commit pushed to master gets
# its own group, so that a run waiting behind another is never cancelled and
# every master commit keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test (workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      # golangci-lint, govulncheck, goveralls and mockery, each built from its
      # pinned module under tools/ and verified by that module's go.sum.
      - name: Install the pinned tools
        run: make tools

      # Mocks are generated, never committed: every test build needs them.
      - name: Generate mocks
        run: make generate

      - name: Check every module on its own
        run: make check-modules

      - name: Build all modules
        run: make build

      - name: Test all modules (race + coverage)
        run: make test

      - name: Lint all modules
        run: make lint

      # goveralls, built from tools/goveralls, authenticates with the
      # read-only workflow token; a Coveralls outage never fails the build.
      - name: Upload the coverage to Coveralls
        continue-on-error: true
        env:
          COVERALLS_TOKEN: ${{ github.token }}
        run: make coveralls
