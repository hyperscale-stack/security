name: Release

# Each module of the workspace is released on its own (docs/releasing.md).
# The module path is part of the tag:
#
#   v1.2.3                  -> the core module (github.com/hyperscale-stack/security)
#   http/v1.2.3             -> github.com/hyperscale-stack/security/http
#   oauth2/store/sql/v1.2.3 -> github.com/hyperscale-stack/security/oauth2/store/sql
#
# Pushing such a tag verifies the tagged commit with a read-only token, then a
# separate job publishes the GitHub release. Nothing is pushed and no tag is
# created by this workflow. scripts/release-check.sh refuses any tag the
# filters below let through that is not a release of a module.
on:
  push:
    tags:
      - "v[0-9]*"
      - "**/v[0-9]*"

permissions:
  contents: read

# One run per tag, never cancelled halfway through a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dir: ${{ steps.tag.outputs.dir }}
      previous: ${{ steps.tag.outputs.previous }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags and origin/master: release-check verifies that the
          # tagged commit is on master and finds the module's previous tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          # A release never reads a cache that another run wrote.
          cache: false

      - name: Install the pinned tools
        run: make tools

      - name: Generate mocks
        run: make generate

      # Tag, module and version; placeholder requirements; commit on master;
      # the module built and vetted the way a consumer resolves it.
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release-check.sh "$TAG"

      - name: Check every module on its own
        run: make check-modules

      - name: Build all modules
        run: make build

      - name: Test all modules (race + coverage)
        run: make test

      - name: Lint all modules
        run: make lint

      # The released module's own code, outside the workspace: an advisory
      # in another module or only reachable from tests does not block this
      # release. The full scan (every module, tests included) is the
      # govulncheck workflow, green on the release commit (docs/releasing.md).
      - name: Scan the released module (govulncheck)
        env:
          DIR: ${{ steps.tag.outputs.dir }}
        run: cd "$DIR" && GOWORK=off "$GITHUB_WORKSPACE/build/bin/govulncheck" ./...

      # Broader than the govulncheck step: every requirement of the
      # released module's go.mod, test-only ones included, against the OSV
      # database (make osv). An exception goes into osv-scanner.toml on
      # master; nothing publishes over a failing scan.
      - name: Scan the released module (OSV-Scanner)
        env:
          DIR: ${{ steps.tag.outputs.dir }}
        run: make osv OSV_MODULES="$DIR"

  publish:
    name: Publish ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    # Required reviewers can be set on this environment to approve each
    # publication before the write token below is minted.
    environment: release
    permissions:
      contents: write # create the GitHub release; no checkout, no third-party code
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIR: ${{ needs.verify.outputs.dir }}
          PREVIOUS: ${{ needs.verify.outputs.previous }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          module="github.com/$GITHUB_REPOSITORY"
          if [ "$DIR" != "." ]; then module="$module/$DIR"; fi
          set -- --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes \
            --notes "Release of the \`$module\` module. See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/master/CHANGELOG.md) for the consolidated history."
          # Notes since the previous release of the same module, not of any
          # module of the repository.
          if [ -n "$PREVIOUS" ]; then set -- "$@" --notes-start-tag "$PREVIOUS"; fi
          if [ "$PRERELEASE" = "true" ]; then set -- "$@" --prerelease; fi
          # The repository's "latest" release (README badge) is the core's.
          if [ "$DIR" != "." ]; then set -- "$@" --latest=false; fi
          gh release create "$TAG" "$@"
